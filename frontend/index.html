<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 지식 퀴즈 게임</title>
  <!-- Confetti 폭죽 효과 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --correct: #16a34a;
      --wrong: #dc2626;
      --warning: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
      transition: transform 0.1s ease-in-out;
    }

    /* 화면 흔들림 애니메이션 (오답 시) */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    /* 헤더 및 상태창 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 14px;
    }

    .hearts {
      color: #ef4444;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .combo-badge {
      background: #fef3c7;
      color: #d97706;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 타이머 바 */
    .timer-container {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--primary);
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* 찬스 버튼 영역 */
    .chance-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chance-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chance-btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: var(--primary);
      color: var(--primary);
    }

    .chance-btn:disabled {
      background: #f1f5f9;
      color: #cbd5e1;
      border-color: #e2e8f0;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .quiz-card { display: none; }
    .quiz-card.active { display: block; }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      background: #e2e8f0;
      margin-right: 6px;
    }

    .question {
      font-size: 17px;
      font-weight: 600;
      margin: 16px 0 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: white;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn.correct {
      border-color: var(--correct);
      background-color: #f0fdf4;
      color: var(--correct);
      font-weight: bold;
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background-color: #fef2f2;
      color: var(--wrong);
    }

    .explanation-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .next-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .loading-screen {
      text-align: center;
      padding: 40px 10px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container" id="gameContainer">
    <div class="header">
      <h2 style="margin: 0; font-size: 20px;">📈 주식 지식 퀴즈</h2>
      <div id="comboBadge" class="combo-badge">🔥 2 Combo!</div>
    </div>

    <!-- 대시보드 상태바 -->
    <div class="status-bar">
      <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
      <div id="scoreDisplay">점수: 0</div>
    </div>

    <!-- 1. 백엔드 연결 로딩 화면 -->
    <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
      <p id="loadingText" style="font-weight: bold; color: #475569;">백엔드 서버에 연결 중입니다...</p>
      <p style="font-size: 12px; color: #94a3b8;">무료 서버 특성상 첫 접속 시 30~50초 정도 소요될 수 있습니다.</p>
    </div>

    <!-- 2. 퀴즈 본문 화면 -->
    <div id="quizCard" class="quiz-card">
      <!-- 실시간 타이머 바 -->
      <div class="timer-container">
        <div id="timerBar" class="timer-bar"></div>
      </div>

      <!-- 찬스 아이템 영역 -->
      <div class="chance-container">
        <button id="btn5050" class="chance-btn" onclick="use5050()">☯️ 50:50 찬스</button>
        <button id="btnTime" class="chance-btn" onclick="useAddTime()">⏰ +5초 추가</button>
      </div>

      <div>
        <span class="tag" id="tierTag" style="background:#dbeafe; color:#1e40af;">초급</span>
        <span class="tag" id="categoryTag">기초용어</span>
      </div>

      <div class="question" id="questionText">질문이 여기에 표시됩니다.</div>

      <div class="options-grid" id="optionsContainer"></div>

      <div id="explanationBox" class="explanation-box"></div>

      <button id="nextBtn" class="next-btn" onclick="nextQuestion()">다음 문제 ▶</button>
    </div>

    <!-- 하단 푸터 -->
    <footer style="margin-top: 30px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 16px;">
      <p style="margin: 0 0 6px 0;">© 2026 주식 지식 퀴즈 게임. All rights reserved.</p>
      <p style="margin: 0;">
        <a href="terms.html" style="color: #2563eb; text-decoration: none; margin: 0 6px; font-weight: bold;">이용약관 및 면책조항</a> | 
        <a href="privacy.html" style="color: #2563eb; text-decoration: none; margin: 0 6px;">개인정보처리방침</a>
      </p>
    </footer>
  </div>

  <script>
    const API_BASE_URL = 'https://stock-quiz-game.onrender.com';

    // 게임 상태 변수
    let quizzes = [];
    let currentIndex = 0;
    let totalScore = 0;
    let lives = 3;
    let combo = 0;

    // 타이머 변수
    const QUESTION_TIME_LIMIT = 10; // 초 단위
    let timeLeft = QUESTION_TIME_LIMIT;
    let timerInterval = null;

    // 찬스 아이템 사용 여부
    let used5050 = false;
    let usedAddTime = false;

    // 초기화 및 데이터 수집
    async function initGame() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/quizzes`);
        if (!response.ok) throw new Error('서버 응답 오류');
        
        quizzes = await response.json();
        
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('quizCard').classList.add('active');
        
        resetGameVariables();
        renderQuiz();
      } catch (error) {
        console.error('API 연결 실패:', error);
        document.getElementById('loadingText').innerText = '서버 연결에 실패했습니다. 페이지를 새로고침해 주세요.';
      }
    }

    // 게임 변수 초기화
    function resetGameVariables() {
      currentIndex = 0;
      totalScore = 0;
      lives = 3;
      combo = 0;
      used5050 = false;
      usedAddTime = false;

      document.getElementById('btn5050').disabled = false;
      document.getElementById('btnTime').disabled = false;
      document.getElementById('scoreDisplay').innerText = `점수: ${totalScore}`;
      updateHeartsDisplay();
      updateComboDisplay();
    }

    // 하트 표시 업데이트
    function updateHeartsDisplay() {
      const heartStr = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
      document.getElementById('heartsDisplay').innerText = heartStr;
    }

    // 콤보 표시 업데이트
    function updateComboDisplay() {
      const badge = document.getElementById('comboBadge');
      if (combo >= 2) {
        badge.innerText = `🔥 ${combo} Combo!`;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }

    // 타이머 시작
    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = QUESTION_TIME_LIMIT;
      updateTimerBar();

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        updateTimerBar();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 100);
    }

    // 타이머 바 UI 업데이트
    function updateTimerBar() {
      const timerBar = document.getElementById('timerBar');
      const percentage = (timeLeft / QUESTION_TIME_LIMIT) * 100;
      timerBar.style.width = `${Math.max(0, percentage)}%`;

      if (percentage < 30) {
        timerBar.style.backgroundColor = 'var(--wrong)';
      } else if (percentage < 60) {
        timerBar.style.backgroundColor = 'var(--warning)';
      } else {
        timerBar.style.backgroundColor = 'var(--primary)';
      }
    }

    // 시간 초과 처리
    function handleTimeout() {
      triggerShake();
      combo = 0;
      lives--;
      updateHeartsDisplay();
      updateComboDisplay();

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);

      // 정답 백엔드 검증 없이 알림 및 처리
      const q = quizzes[currentIndex];
      submitAnswer(-1, null, true); // -1은 시간 초과
    }

    // 화면 흔들림 애니메이션
    function triggerShake() {
      const container = document.getElementById('gameContainer');
      container.classList.add('shake');
      setTimeout(() => container.classList.remove('shake'), 400);
    }

    // 문제 렌더링
    function renderQuiz() {
      const q = quizzes[currentIndex];
      document.getElementById('tierTag').innerText = q.tier;
      document.getElementById('categoryTag').innerText = q.category;
      document.getElementById('questionText').innerText = `Q${currentIndex + 1}. ${q.question}`;
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      q.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${index + 1}. ${optText}`;
        btn.onclick = () => submitAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      startTimer();
    }

    // 정답 제출 및 검증
    async function submitAnswer(selectedIndex, selectedBtn, isTimeout = false) {
      clearInterval(timerInterval);

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);

      const q = quizzes[currentIndex];

      try {
        const res = await fetch(`${API_BASE_URL}/api/quiz/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            quiz_id: q.id,
            selected_index: selectedIndex
          })
        });

        const result = await res.json();

        if (result.is_correct && !isTimeout) {
          selectedBtn.classList.add('correct');
          combo++;
          
          // 스피드 보너스 및 콤보 가산점 계산
          const speedBonus = Math.floor(timeLeft * 10);
          const comboBonus = combo > 1 ? combo * 20 : 0;
          totalScore += result.points + speedBonus + comboBonus;
          
          document.getElementById('scoreDisplay').innerText = `점수: ${totalScore}`;

          // Confetti 폭죽 효과 터뜨리기
          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.7 }
          });

        } else {
          combo = 0;
          if (!isTimeout) {
            selectedBtn.classList.add('wrong');
            lives--;
            triggerShake();
            updateHeartsDisplay();
          }
          buttons[result.correct_index].classList.add('correct');
        }

        updateComboDisplay();

        // 해설 표출
        const expBox = document.getElementById('explanationBox');
        expBox.innerHTML = `<strong>💡 해설:</strong> ${result.explanation}`;
        expBox.style.display = 'block';

        // 목숨이 남아있으면 다음 버튼, 다 달았으면 게임오버 처리
        if (lives > 0) {
          document.getElementById('nextBtn').style.display = 'block';
        } else {
          setTimeout(() => {
            alert(`💔 하트가 모두 소진되었습니다!\n최종 점수: ${totalScore}점`);
            restartGameSession();
          }, 500);
        }

      } catch (err) {
        alert('답안 제출 중 오류가 발생했습니다.');
      }
    }

    // 50:50 찬스 아이템
    async function use5050() {
      if (used5050) return;
      
      const q = quizzes[currentIndex];
      // 서버에서 정답 인덱스 확인
      try {
        const res = await fetch(`${API_BASE_URL}/api/quiz/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quiz_id: q.id, selected_index: 0 })
        });
        const result = await res.json();
        const correctIndex = result.correct_index;

        const buttons = document.querySelectorAll('.option-btn');
        let removed = 0;

        buttons.forEach((btn, index) => {
          if (index !== correctIndex && removed < 2) {
            btn.style.visibility = 'hidden';
            removed++;
          }
        });

        used5050 = true;
        document.getElementById('btn5050').disabled = true;

      } catch (e) {
        console.error(e);
      }
    }

    // 시간 +5초 추가 찬스 아이템
    function useAddTime() {
      if (usedAddTime) return;
      timeLeft += 5;
      updateTimerBar();
      usedAddTime = true;
      document.getElementById('btnTime').disabled = true;
    }

    // 다음 문제 이동
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizzes.length) {
        renderQuiz();
      } else {
        alert(`🎉 퀴즈 세트 클리어!\n최종 점수: ${totalScore}점`);
        restartGameSession();
      }
    }

    // 새 판 시작
    function restartGameSession() {
      document.getElementById('quizCard').classList.remove('active');
      document.getElementById('loadingScreen').style.display = 'block';
      document.getElementById('loadingText').innerText = '새로운 퀴즈 세트를 불러오는 중입니다...';
      initGame();
    }

    initGame();
  </script>
</body>
</html>
