<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 지식 퀴즈 게임</title>
  <!-- Confetti 폭죽 효과 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --correct: #16a34a;
      --wrong: #dc2626;
      --warning: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-12px);
      }

      40% {
        transform: translateX(12px);
      }

      60% {
        transform: translateX(-8px);
      }

      80% {
        transform: translateX(8px);
      }
    }

    /* 헤더 및 상단 메뉴 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .deck-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .deck-btn:hover {
      background: #1d4ed8;
    }

    /* 대시보드 상태바 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .hearts {
      color: #ef4444;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .combo-badge {
      background: #fef3c7;
      color: #d97706;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
    }

    /* 장착 중인 카드 버프 표시 */
    .buff-bar {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 타이머 바 */
    .timer-container {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--primary);
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* 찬스 버튼 영역 */
    .chance-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chance-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
    }

    .chance-btn:disabled {
      background: #f1f5f9;
      color: #cbd5e1;
      border-color: #e2e8f0;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .quiz-card {
      display: none;
    }

    .quiz-card.active {
      display: block;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      background: #e2e8f0;
      margin-right: 6px;
    }

    .question {
      font-size: 17px;
      font-weight: 600;
      margin: 16px 0 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: white;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn.correct {
      border-color: var(--correct);
      background-color: #f0fdf4;
      color: var(--correct);
      font-weight: bold;
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background-color: #fef2f2;
      color: var(--wrong);
    }

    .explanation-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .next-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    /* 로딩 화면 */
    .loading-screen {
      text-align: center;
      padding: 40px 10px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* 모달 팝업 공통 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    /* 가챠 & 도감 카드 스타일 */
    .card-item {
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grade-SSR {
      border-color: #f59e0b;
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
    }

    .grade-A {
      border-color: #8b5cf6;
      background: linear-gradient(135deg, #f5f3ff, #ede9fe);
    }

    .grade-B {
      border-color: #3b82f6;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
    }

    .grade-C {
      border-color: #94a3b8;
      background: #f1f5f9;
    }

    .grade-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      color: white;
    }

    .badge-SSR {
      background: #d97706;
    }

    .badge-A {
      background: #7c3aed;
    }

    .badge-B {
      background: #2563eb;
    }

    .badge-C {
      background: #64748b;
    }

    .gacha-box {
      text-align: center;
      padding: 20px 0;
    }

    .gacha-card-anim {
      width: 180px;
      height: 240px;
      margin: 0 auto 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      animation: flip 0.6s ease-out;
    }

    @keyframes flip {
      0% {
        transform: rotateY(90deg);
        opacity: 0;
      }

      100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="gameContainer">
    <div class="header">
      <h2 style="margin: 0; font-size: 20px;">📈 주식 지식 퀴즈</h2>
      <button class="deck-btn" onclick="openDeckModal()">🎴 내 카드 도감</button>
    </div>

    <!-- 대시보드 상태바 -->
    <div class="status-bar">
      <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
      <div id="comboBadge" class="combo-badge">🔥 2 Combo!</div>
      <div id="scoreDisplay">점수: 0</div>
    </div>

    <!-- 장착 카드 버프 표시 -->
    <div class="buff-bar" id="buffBar">
      <span>🎴 장착 없음 (기본 효과)</span>
    </div>

    <!-- 1. 백엔드 연결 로딩 화면 -->
    <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
      <p id="loadingText" style="font-weight: bold; color: #475569;">백엔드 서버에 연결 중입니다...</p>
      <p style="font-size: 12px; color: #94a3b8;">무료 서버 특성상 첫 접속 시 30~50초 소요될 수 있습니다.</p>
    </div>

    <!-- 2. 퀴즈 본문 화면 -->
    <div id="quizCard" class="quiz-card">
      <div class="timer-container">
        <div id="timerBar" class="timer-bar"></div>
      </div>

      <div class="chance-container">
        <button id="btn5050" class="chance-btn" onclick="use5050()">☯️ 50:50 찬스</button>
        <button id="btnTime" class="chance-btn" onclick="useAddTime()">⏰ +5초 추가</button>
      </div>

      <div>
        <span class="tag" id="tierTag" style="background:#dbeafe; color:#1e40af;">초급</span>
        <span class="tag" id="categoryTag">기초용어</span>
      </div>

      <div class="question" id="questionText">질문이 여기에 표시됩니다.</div>
      <div class="options-grid" id="optionsContainer"></div>
      <div id="explanationBox" class="explanation-box"></div>

      <button id="nextBtn" class="next-btn" onclick="nextQuestion()">다음 문제 ▶</button>
    </div>

    <!-- 푸터 -->
    <footer
      style="margin-top: 30px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 16px;">
      <p style="margin: 0 0 6px 0;">© 2026 주식 지식 퀴즈 게임. All rights reserved.</p>
      <p style="margin: 0;">
        <a href="terms.html" style="color: #2563eb; text-decoration: none; margin: 0 6px; font-weight: bold;">이용약관 및
          면책조항</a> |
        <a href="privacy.html" style="color: #2563eb; text-decoration: none; margin: 0 6px;">개인정보처리방침</a>
      </p>
    </footer>
  </div>

  <!-- 3. 가챠(카드 뽑기) 모달 -->
  <div class="modal-overlay" id="gachaModal">
    <div class="modal-card gacha-box">
      <h3 style="margin-top: 0;">🎉 10문제 완주 축하합니다!</h3>
      <p style="font-size: 14px; color: #64748b;">주식 기업 가챠 카드 1회 뽑기권을 획득했습니다.</p>

      <div id="gachaResultContainer"
        style="min-height: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <button onclick="drawGachaCard()"
          style="padding: 16px 32px; font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; cursor: pointer;">
          🎴 카드 뽑기 실행!
        </button>
      </div>

      <button onclick="closeGachaModal()"
        style="width: 100%; margin-top: 16px; padding: 12px; background: #e2e8f0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">닫기
        및 다음 판 시작</button>
    </div>
  </div>

  <!-- 4. 내 카드 도감 모달 -->
  <div class="modal-overlay" id="deckModal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0;">🎴 내 카드 도감</h3>
        <span onclick="closeDeckModal()" style="font-size: 20px; cursor: pointer; color: #94a3b8;">&times;</span>
      </div>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">수집한 카드를 장착하면 게임 내 강력한 패시브 스탯이 적용됩니다.</p>

      <div id="deckListContainer"></div>

      <button onclick="closeDeckModal()"
        style="width: 100%; margin-top: 12px; padding: 12px; background: #e2e8f0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">닫기</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://stock-quiz-game.onrender.com';

    // 🎴 카드 마스터 데이터베이스
    const CARD_DATABASE = [
      { id: 'c1', name: '페니스톡 동전주', grade: 'C', rate: 45, effectType: 'score', value: 0.05, desc: '획득 점수 +5%' },
      { id: 'c2', name: '잡주 바이오', grade: 'C', rate: 25, effectType: 'timer', value: 1, desc: '제한시간 +1초' },
      { id: 'b1', name: '카카오', grade: 'B', rate: 15, effectType: 'score', value: 0.10, desc: '획득 점수 +10%' },
      { id: 'b2', name: '네이버', grade: 'B', rate: 10, effectType: 'timer', value: 2, desc: '제한시간 +2초' },
      { id: 'a1', name: '삼성전자', grade: 'A', rate: 3.5, effectType: 'timer', value: 3, desc: '제한시간 +3초' },
      { id: 'a2', name: '테슬라', grade: 'A', rate: 1.0, effectType: 'score', value: 0.20, desc: '획득 점수 +20%' },
      { id: 'ssr1', name: '워렌 버핏', grade: 'SSR', rate: 0.4, effectType: 'score', value: 0.35, desc: '획득 점수 +35%' },
      { id: 'ssr2', name: '피터 린치', grade: 'SSR', rate: 0.1, effectType: 'heart', value: 1, desc: '기본 목숨 +1개 (하트 4개)' }
    ];

    // 유저 보유 데이터 (localStorage 저장)
    let myCards = JSON.parse(localStorage.getItem('sq_my_cards')) || ['c1']; // 기본 C등급 카드 1개 제공
    let equippedCardId = localStorage.getItem('sq_equipped_card') || 'c1';

    // 게임 상태 변수
    let quizzes = [];
    let currentIndex = 0;
    let totalScore = 0;
    let lives = 3;
    let combo = 0;

    let baseTimeLimit = 10;
    let timeLeft = 10;
    let timerInterval = null;

    let used5050 = false;
    let usedAddTime = false;

    // 게임 시작 및 버프 계산
    async function initGame() {
      applyEquippedCardBuff();

      try {
        const response = await fetch(`${API_BASE_URL}/api/quizzes?count=10`);
        if (!response.ok) throw new Error('서버 응답 오류');

        quizzes = await response.json();

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('quizCard').classList.add('active');

        resetGameVariables();
        renderQuiz();
      } catch (error) {
        console.error('API 연결 실패:', error);
        document.getElementById('loadingText').innerText = '서버 연결에 실패했습니다. 페이지를 새로고침해 주세요.';
      }
    }

    // 장착 카드 버프 적용
    function applyEquippedCardBuff() {
      const card = CARD_DATABASE.find(c => c.id === equippedCardId);
      const buffBar = document.getElementById('buffBar');

      baseTimeLimit = 10;

      if (card) {
        buffBar.innerHTML = `<span>🎴 [${card.grade}] ${card.name} 장착 중</span><strong>✨ ${card.desc}</strong>`;
        if (card.effectType === 'timer') {
          baseTimeLimit += card.value;
        }
      } else {
        buffBar.innerHTML = `<span>🎴 장착 없음 (기본 효과)</span>`;
      }
    }

    // 게임 상태 리셋
    function resetGameVariables() {
      currentIndex = 0;
      totalScore = 0;
      combo = 0;
      used5050 = false;
      usedAddTime = false;

      const card = CARD_DATABASE.find(c => c.id === equippedCardId);
      lives = (card && card.effectType === 'heart') ? 3 + card.value : 3;

      document.getElementById('btn5050').disabled = false;
      document.getElementById('btnTime').disabled = false;
      document.getElementById('scoreDisplay').innerText = `점수: ${totalScore}`;
      updateHeartsDisplay();
      updateComboDisplay();
    }

    function updateHeartsDisplay() {
      const card = CARD_DATABASE.find(c => c.id === equippedCardId);
      const maxLives = (card && card.effectType === 'heart') ? 4 : 3;
      const heartStr = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, maxLives - lives));
      document.getElementById('heartsDisplay').innerText = heartStr;
    }

    function updateComboDisplay() {
      const badge = document.getElementById('comboBadge');
      if (combo >= 2) {
        badge.innerText = `🔥 ${combo} Combo!`;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = baseTimeLimit;
      updateTimerBar();

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        updateTimerBar();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 100);
    }

    function updateTimerBar() {
      const timerBar = document.getElementById('timerBar');
      const percentage = (timeLeft / baseTimeLimit) * 100;
      timerBar.style.width = `${Math.max(0, percentage)}%`;

      if (percentage < 30) timerBar.style.backgroundColor = 'var(--wrong)';
      else if (percentage < 60) timerBar.style.backgroundColor = 'var(--warning)';
      else timerBar.style.backgroundColor = 'var(--primary)';
    }

    function handleTimeout() {
      triggerShake();
      combo = 0;
      lives--;
      updateHeartsDisplay();
      updateComboDisplay();

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);
      submitAnswer(-1, null, true);
    }

    function triggerShake() {
      const container = document.getElementById('gameContainer');
      container.classList.add('shake');
      setTimeout(() => container.classList.remove('shake'), 400);
    }

    function renderQuiz() {
      const q = quizzes[currentIndex];
      document.getElementById('tierTag').innerText = q.tier;
      document.getElementById('categoryTag').innerText = q.category;
      document.getElementById('questionText').innerText = `Q${currentIndex + 1}. ${q.question}`;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      q.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${index + 1}. ${optText}`;
        btn.onclick = () => submitAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      startTimer();
    }

    async function submitAnswer(selectedIndex, selectedBtn, isTimeout = false) {
      clearInterval(timerInterval);

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);

      const q = quizzes[currentIndex];

      try {
        const res = await fetch(`${API_BASE_URL}/api/quiz/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quiz_id: q.id, selected_index: selectedIndex })
        });

        const result = await res.json();

        if (result.is_correct && !isTimeout) {
          selectedBtn.classList.add('correct');
          combo++;

          const speedBonus = Math.floor(timeLeft * 10);
          const comboBonus = combo > 1 ? combo * 20 : 0;
          let calculatedPoints = result.points + speedBonus + comboBonus;

          // 점수 증가 카드 버프 반영
          const card = CARD_DATABASE.find(c => c.id === equippedCardId);
          if (card && card.effectType === 'score') {
            calculatedPoints = Math.floor(calculatedPoints * (1 + card.value));
          }

          totalScore += calculatedPoints;
          document.getElementById('scoreDisplay').innerText = `점수: ${totalScore}`;

          confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });

        } else {
          combo = 0;
          if (!isTimeout) {
            selectedBtn.classList.add('wrong');
            lives--;
            triggerShake();
            updateHeartsDisplay();
          }
          buttons[result.correct_index].classList.add('correct');
        }

        updateComboDisplay();

        const expBox = document.getElementById('explanationBox');
        expBox.innerHTML = `<strong>💡 해설:</strong> ${result.explanation}`;
        expBox.style.display = 'block';

        if (lives > 0) {
          document.getElementById('nextBtn').style.display = 'block';
        } else {
          setTimeout(() => {
            alert(`💔 하트가 모두 소진되었습니다!\n최종 점수: ${totalScore}점`);
            restartGameSession();
          }, 500);
        }

      } catch (err) {
        alert('답안 제출 중 오류가 발생했습니다.');
      }
    }

    async function use5050() {
      if (used5050) return;
      const q = quizzes[currentIndex];
      try {
        const res = await fetch(`${API_BASE_URL}/api/quiz/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quiz_id: q.id, selected_index: 0 })
        });
        const result = await res.json();
        const correctIndex = result.correct_index;

        const buttons = document.querySelectorAll('.option-btn');
        let removed = 0;

        buttons.forEach((btn, index) => {
          if (index !== correctIndex && removed < 2) {
            btn.style.visibility = 'hidden';
            removed++;
          }
        });

        used5050 = true;
        document.getElementById('btn5050').disabled = true;
      } catch (e) { console.error(e); }
    }

    function useAddTime() {
      if (usedAddTime) return;
      timeLeft += 5;
      updateTimerBar();
      usedAddTime = true;
      document.getElementById('btnTime').disabled = true;
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizzes.length) {
        renderQuiz();
      } else {
        // 10문제 완주 시 가챠 모달 오픈
        openGachaModal();
      }
    }

    function restartGameSession() {
      document.getElementById('quizCard').classList.remove('active');
      document.getElementById('loadingScreen').style.display = 'block';
      document.getElementById('loadingText').innerText = '새로운 퀴즈 세트를 불러오는 중입니다...';
      initGame();
    }

    // 🎰 가챠(카드 뽑기) 로직
    function openGachaModal() {
      document.getElementById('gachaModal').classList.add('active');
      document.getElementById('gachaResultContainer').innerHTML = `
        <button onclick="drawGachaCard()" style="padding: 16px 32px; font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; cursor: pointer;">
          🎴 카드 뽑기 실행!
        </button>
      `;
    }

    function drawGachaCard() {
      // 확률 가중치 기반 무작위 추첨
      const rand = Math.random() * 100;
      let cumulative = 0;
      let drawnCard = CARD_DATABASE[0];

      for (let card of CARD_DATABASE) {
        cumulative += card.rate;
        if (rand <= cumulative) {
          drawnCard = card;
          break;
        }
      }

      // 카드 저장
      if (!myCards.includes(drawnCard.id)) {
        myCards.push(drawnCard.id);
        localStorage.setItem('sq_my_cards', JSON.stringify(myCards));
      }

      // 폭죽 연출
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });

      // 카드 화면 표출
      document.getElementById('gachaResultContainer').innerHTML = `
        <div class="gacha-card-anim grade-${drawnCard.grade}">
          <span class="grade-badge badge-${drawnCard.grade}">${drawnCard.grade}</span>
          <h3 style="margin: 12px 0 6px 0;">${drawnCard.name}</h3>
          <p style="font-size: 13px; font-weight: bold; color: #475569;">${drawnCard.desc}</p>
        </div>
        <p style="font-size: 14px; font-weight: bold; color: #16a34a;">✨ 획득 성공! 도감에 저장되었습니다.</p>
      `;
    }

    function closeGachaModal() {
      document.getElementById('gachaModal').classList.remove('active');
      restartGameSession();
    }

    // 🎴 내 카드 도감 모달 로직
    function openDeckModal() {
      renderDeckList();
      document.getElementById('deckModal').classList.add('active');
    }

    function closeDeckModal() {
      document.getElementById('deckModal').classList.remove('active');
    }

    function renderDeckList() {
      const container = document.getElementById('deckListContainer');
      container.innerHTML = '';

      CARD_DATABASE.forEach(card => {
        const isOwned = myCards.includes(card.id);
        const isEquipped = (equippedCardId === card.id);

        const cardEl = document.createElement('div');
        cardEl.className = `card-item ${isOwned ? 'grade-' + card.grade : ''}`;
        if (!isOwned) cardEl.style.opacity = '0.4';

        cardEl.innerHTML = `
          <div>
            <span class="grade-badge badge-${card.grade}">${card.grade}</span>
            <strong style="margin-left: 6px; font-size: 15px;">${card.name}</strong>
            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">${card.desc}</div>
          </div>
          <div>
            ${!isOwned ? '<span style="font-size: 12px; color: #94a3b8;">미보유</span>' :
            isEquipped ? '<span style="font-size: 12px; font-weight: bold; color: #2563eb;">[장착 중]</span>' :
              `<button onclick="equipCard('${card.id}')" style="padding: 6px 12px; font-size: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">장착</button>`
          }
          </div>
        `;
        container.appendChild(cardEl);
      });
    }

    function equipCard(cardId) {
      equippedCardId = cardId;
      localStorage.setItem('sq_equipped_card', cardId);
      applyEquippedCardBuff();
      renderDeckList();
    }

    initGame();
  </script>
</body>

</html>
